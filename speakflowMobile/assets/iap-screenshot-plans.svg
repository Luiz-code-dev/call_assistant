<svg width="640" height="920" viewBox="0 0 640 920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#0f0f12"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="basicGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(124,58,237,0.18)"/>
      <stop offset="100%" stop-color="rgba(79,70,229,0.10)"/>
    </linearGradient>
    <linearGradient id="premGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(99,102,241,0.22)"/>
      <stop offset="100%" stop-color="rgba(139,92,246,0.12)"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="640" height="920" fill="url(#bg)"/>

  <!-- Status bar -->
  <rect x="0" y="0" width="640" height="44" fill="#09090b"/>
  <text x="48" y="28" font-family="SF Pro Display, Arial" font-size="15" font-weight="600" fill="#ffffff">9:41</text>
  <text x="560" y="28" font-family="SF Pro Display, Arial" font-size="13" fill="#ffffff">●●●</text>

  <!-- Header bar -->
  <rect x="0" y="44" width="640" height="56" fill="#09090b"/>
  <text x="320" y="80" font-family="SF Pro Display, Arial" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Plano e Cobrança</text>
  <text x="600" y="80" font-family="SF Pro Display, Arial" font-size="22" fill="#71717a" text-anchor="middle">✕</text>

  <!-- Divider -->
  <rect x="0" y="100" width="640" height="1" fill="#27272a"/>

  <!-- Credits current -->
  <text x="32" y="136" font-family="SF Pro Display, Arial" font-size="12" fill="#71717a">Seus créditos atuais: </text>
  <text x="204" y="136" font-family="SF Pro Display, Arial" font-size="12" font-weight="700" fill="#ffffff">50</text>

  <!-- Section label: ASSINAR UM PLANO -->
  <text x="32" y="170" font-family="SF Pro Display, Arial" font-size="11" font-weight="600" fill="#71717a" letter-spacing="1">ASSINAR UM PLANO</text>

  <!-- Plan card: Básico -->
  <rect x="24" y="184" width="592" height="80" rx="14" fill="url(#basicGrad)" stroke="#6d28d9" stroke-width="1.2" stroke-opacity="0.5"/>
  <text x="48" y="220" font-family="SF Pro Display, Arial" font-size="16" font-weight="700" fill="#ffffff">Plano Básico</text>
  <text x="48" y="242" font-family="SF Pro Display, Arial" font-size="12" fill="#71717a">500 créditos/mês</text>
  <!-- Price badge -->
  <rect x="476" y="206" width="116" height="34" rx="10" fill="rgba(124,58,237,0.20)" stroke="rgba(124,58,237,0.40)" stroke-width="1"/>
  <text x="534" y="228" font-family="SF Pro Display, Arial" font-size="12" font-weight="700" fill="#a78bfa" text-anchor="middle">R$ 74,90/mês</text>

  <!-- Plan card: Premium -->
  <rect x="24" y="278" width="592" height="80" rx="14" fill="url(#premGrad)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.5"/>
  <!-- Popular badge -->
  <rect x="244" y="270" width="72" height="18" rx="9" fill="url(#purpleGrad)"/>
  <text x="280" y="282" font-family="SF Pro Display, Arial" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">POPULAR</text>
  <text x="48" y="316" font-family="SF Pro Display, Arial" font-size="16" font-weight="700" fill="#ffffff">Plano Premium</text>
  <text x="48" y="338" font-family="SF Pro Display, Arial" font-size="12" fill="#71717a">1.000 créditos/mês</text>
  <rect x="450" y="299" width="142" height="34" rx="10" fill="rgba(124,58,237,0.20)" stroke="rgba(124,58,237,0.40)" stroke-width="1"/>
  <text x="521" y="321" font-family="SF Pro Display, Arial" font-size="12" font-weight="700" fill="#a78bfa" text-anchor="middle">R$ 149,90/mês</text>

  <!-- Divider -->
  <rect x="24" y="380" width="592" height="1" fill="#27272a"/>

  <!-- Section label: INFO -->
  <text x="32" y="412" font-family="SF Pro Display, Arial" font-size="11" fill="#52525b">✓  Cancele a qualquer momento</text>
  <text x="32" y="434" font-family="SF Pro Display, Arial" font-size="11" fill="#52525b">✓  Créditos renovam todo mês</text>
  <text x="32" y="456" font-family="SF Pro Display, Arial" font-size="11" fill="#52525b">✓  Acesso a todas as ferramentas de IA</text>
  <text x="32" y="478" font-family="SF Pro Display, Arial" font-size="11" fill="#52525b">✓  Cobrança via Apple — seguro e simples</text>

  <!-- Bottom tab bar -->
  <rect x="0" y="840" width="640" height="80" fill="#09090b"/>
  <rect x="0" y="840" width="640" height="1" fill="#27272a"/>
  <!-- Tab icons -->
  <text x="80" y="878" font-family="Arial" font-size="22" text-anchor="middle">🏠</text>
  <text x="213" y="878" font-family="Arial" font-size="22" text-anchor="middle">🔧</text>
  <text x="320" y="878" font-family="Arial" font-size="22" text-anchor="middle">🎙</text>
  <text x="427" y="878" font-family="Arial" font-size="22" text-anchor="middle">👥</text>
  <text x="560" y="878" font-family="Arial" font-size="22" text-anchor="middle">👤</text>
  <!-- Active dot under Profile -->
  <circle cx="560" cy="895" r="3" fill="#7c3aed"/>

  <!-- SpeakFlow logo top left -->
  <rect x="24" y="56" width="28" height="28" rx="8" fill="url(#purpleGrad)"/>
  <text x="38" y="75" font-family="Arial" font-size="14" text-anchor="middle" fill="#ffffff">S</text>
</svg>
