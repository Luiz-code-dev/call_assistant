<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1024px; height: 1024px; overflow: hidden;
    background: linear-gradient(145deg, #09090b 0%, #13051e 50%, #09090b 100%);
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
    color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    position: relative;
  }
  .glow {
    position: absolute; width: 600px; height: 600px; border-radius: 50%;
    background: radial-gradient(circle, rgba(124,58,237,0.25) 0%, transparent 70%);
    top: 50%; left: 50%; transform: translate(-50%, -50%);
    pointer-events: none;
  }
  .logo-wrap {
    width: 120px; height: 120px; border-radius: 32px;
    background: linear-gradient(135deg, #7c3aed, #4f46e5);
    display: flex; align-items: center; justify-content: center;
    font-size: 60px; font-weight: 900; margin-bottom: 40px;
    box-shadow: 0 0 60px rgba(124,58,237,0.5);
  }
  .plan-label {
    font-size: 18px; font-weight: 600; color: #a78bfa;
    letter-spacing: 4px; text-transform: uppercase; margin-bottom: 16px;
  }
  .plan-name {
    font-size: 72px; font-weight: 900; color: #fff;
    letter-spacing: -2px; margin-bottom: 12px;
  }
  .plan-price {
    font-size: 36px; font-weight: 700;
    background: linear-gradient(135deg, #a78bfa, #818cf8);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    margin-bottom: 48px;
  }
  .divider { width: 80px; height: 3px; background: linear-gradient(90deg, #7c3aed, #4f46e5); border-radius: 2px; margin-bottom: 48px; }
  .features { display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .feature {
    display: flex; align-items: center; gap: 14px;
    background: rgba(124,58,237,0.12); border: 1px solid rgba(124,58,237,0.25);
    padding: 14px 28px; border-radius: 50px;
    font-size: 22px; color: #d4d4d8;
  }
  .feature-icon { font-size: 24px; }
  .badge {
    position: absolute; top: 60px; right: 60px;
    background: rgba(124,58,237,0.15); border: 1px solid rgba(124,58,237,0.3);
    border-radius: 20px; padding: 8px 20px;
    font-size: 14px; color: #a78bfa; letter-spacing: 2px; text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="badge">SpeakFlow AI</div>
  <div class="logo-wrap">S</div>
  <div class="plan-label">Plano</div>
  <div class="plan-name">Básico</div>
  <div class="plan-price">Plano mensal de IA</div>
  <div class="divider"></div>
  <div class="features">
    <div class="feature"><span class="feature-icon">⚡</span> 500 créditos por mês</div>
    <div class="feature"><span class="feature-icon">🤖</span> Todas as ferramentas de IA</div>
    <div class="feature"><span class="feature-icon">🎙</span> Live Assist incluso</div>
    <div class="feature"><span class="feature-icon">🔄</span> Renovação automática mensal</div>
  </div>
</body>
</html>
