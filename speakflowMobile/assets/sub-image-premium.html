<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1024px; height: 1024px; overflow: hidden;
    background: linear-gradient(145deg, #09090b 0%, #0f0520 50%, #09090b 100%);
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
    color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    position: relative;
  }
  .glow {
    position: absolute; width: 700px; height: 700px; border-radius: 50%;
    background: radial-gradient(circle, rgba(99,102,241,0.30) 0%, transparent 70%);
    top: 50%; left: 50%; transform: translate(-50%, -50%);
    pointer-events: none;
  }
  .glow2 {
    position: absolute; width: 400px; height: 400px; border-radius: 50%;
    background: radial-gradient(circle, rgba(139,92,246,0.20) 0%, transparent 70%);
    top: 20%; right: 10%;
    pointer-events: none;
  }
  .logo-wrap {
    width: 120px; height: 120px; border-radius: 32px;
    background: linear-gradient(135deg, #6366f1, #8b5cf6, #7c3aed);
    display: flex; align-items: center; justify-content: center;
    font-size: 60px; font-weight: 900; margin-bottom: 40px;
    box-shadow: 0 0 80px rgba(99,102,241,0.6);
  }
  .crown { position: absolute; top: -18px; right: -8px; font-size: 32px; }
  .logo-container { position: relative; }
  .plan-label {
    font-size: 18px; font-weight: 600; color: #818cf8;
    letter-spacing: 4px; text-transform: uppercase; margin-bottom: 16px;
  }
  .plan-name {
    font-size: 72px; font-weight: 900; color: #fff;
    letter-spacing: -2px; margin-bottom: 12px;
  }
  .plan-price {
    font-size: 36px; font-weight: 700; color: #818cf8; margin-bottom: 48px;
  }
  .divider { width: 80px; height: 3px; background: linear-gradient(90deg, #6366f1, #8b5cf6); border-radius: 2px; margin-bottom: 48px; }
  .features { display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .feature {
    display: flex; align-items: center; gap: 14px;
    background: rgba(99,102,241,0.12); border: 1px solid rgba(99,102,241,0.25);
    padding: 14px 28px; border-radius: 50px;
    font-size: 22px; color: #d4d4d8;
  }
  .feature-icon { font-size: 24px; }
  .badge {
    position: absolute; top: 60px; right: 60px;
    background: rgba(99,102,241,0.15); border: 1px solid rgba(99,102,241,0.3);
    border-radius: 20px; padding: 8px 20px;
    font-size: 14px; color: #818cf8; letter-spacing: 2px; text-transform: uppercase;
  }
  .popular-tag {
    position: absolute; top: 60px; left: 60px;
    background: linear-gradient(135deg, #7c3aed, #4f46e5);
    border-radius: 20px; padding: 8px 20px;
    font-size: 14px; font-weight: 700; color: #fff; letter-spacing: 1px;
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="glow2"></div>
  <div class="badge">SpeakFlow AI</div>
  <div class="popular-tag">⭐ MAIS POPULAR</div>
  <div class="logo-container">
    <div class="logo-wrap">S</div>
    <div class="crown">👑</div>
  </div>
  <div class="plan-label">Plano</div>
  <div class="plan-name">Premium</div>
  <div class="plan-price">Plano mensal de IA</div>
  <div class="divider"></div>
  <div class="features">
    <div class="feature"><span class="feature-icon">⚡</span> 1.000 créditos por mês</div>
    <div class="feature"><span class="feature-icon">🤖</span> Todas as ferramentas de IA</div>
    <div class="feature"><span class="feature-icon">🎙</span> Live Assist ilimitado</div>
    <div class="feature"><span class="feature-icon">🔄</span> Renovação automática mensal</div>
  </div>
</body>
</html>
