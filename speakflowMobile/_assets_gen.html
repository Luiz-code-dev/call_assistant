<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>SpeakFlow Assets Generator</title></head>
<body style="background:#111;display:flex;flex-direction:column;align-items:center;padding:24px;font-family:sans-serif;color:white;gap:32px;">

<h2 style="margin:0">SpeakFlow — Play Store Assets</h2>

<!-- ICON 512x512 -->
<div style="text-align:center">
  <p style="margin:0 0 8px;opacity:0.7;font-size:13px">ÍCONE DO APP (512×512)</p>
  <canvas id="icon" width="512" height="512" style="border-radius:20%;width:180px;height:180px;display:block;margin:0 auto"></canvas>
  <button onclick="dl('icon','icon_512.png')" style="margin-top:12px;padding:10px 28px;background:#7c3aed;color:white;border:none;border-radius:8px;font-size:14px;cursor:pointer">⬇ icon_512.png</button>
  <p style="opacity:0.4;font-size:11px;margin:4px 0 0">Upload direto no Play Console (Ícone do aplicativo)</p>
</div>

<!-- BANNER 1024x500 -->
<div style="text-align:center">
  <p style="margin:0 0 8px;opacity:0.7;font-size:13px">RECURSO GRÁFICO / BANNER (1024×500)</p>
  <canvas id="banner" width="1024" height="500" style="width:512px;height:250px;display:block;margin:0 auto;border-radius:8px"></canvas>
  <button onclick="dl('banner','banner_1024x500.png')" style="margin-top:12px;padding:10px 28px;background:#7c3aed;color:white;border:none;border-radius:8px;font-size:14px;cursor:pointer">⬇ banner_1024x500.png</button>
  <p style="opacity:0.4;font-size:11px;margin:4px 0 0">Upload no Play Console (Recurso gráfico)</p>
</div>

<script>
function drawIcon(canvas, S) {
  const ctx = canvas.getContext('2d');
  const bg = ctx.createRadialGradient(S/2,S/2,0,S/2,S/2,S*0.7);
  bg.addColorStop(0,'#7c3aed'); bg.addColorStop(0.5,'#5b21b6'); bg.addColorStop(1,'#09090b');
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.roundRect(0,0,S,S,S*0.18); ctx.fill();

  const glow = ctx.createRadialGradient(S/2,S*0.38,0,S/2,S*0.38,S*0.32);
  glow.addColorStop(0,'rgba(167,139,250,0.35)'); glow.addColorStop(1,'rgba(167,139,250,0)');
  ctx.fillStyle=glow; ctx.fillRect(0,0,S,S);

  ctx.fillStyle='white'; ctx.shadowColor='rgba(167,139,250,0.6)'; ctx.shadowBlur=S*0.04;
  const mw=S*0.18,mh=S*0.28,mr=S*0.09,mx=S/2,my=S*0.37;
  ctx.beginPath(); ctx.roundRect(mx-mw/2,my-mh/2,mw,mh,mr); ctx.fill();

  ctx.strokeStyle='white'; ctx.lineWidth=S*0.038; ctx.lineCap='round'; ctx.shadowBlur=S*0.03;
  ctx.beginPath(); ctx.arc(mx,my+mh*0.12,S*0.19,Math.PI*0.05,Math.PI*0.95); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(mx,my+mh*0.12+S*0.19); ctx.lineTo(mx,my+mh*0.12+S*0.29); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(mx-S*0.12,my+mh*0.12+S*0.29); ctx.lineTo(mx+S*0.12,my+mh*0.12+S*0.29); ctx.stroke();

  ctx.shadowBlur=0; ctx.fillStyle='rgba(255,255,255,0.92)';
  ctx.font=`bold ${S*0.072}px Arial,sans-serif`; ctx.textAlign='center';
  ctx.fillText('SpeakFlow',mx,S*0.88);
}

function drawBanner(canvas) {
  const W=1024,H=500,ctx=canvas.getContext('2d');
  const bg=ctx.createLinearGradient(0,0,W,H);
  bg.addColorStop(0,'#09090b'); bg.addColorStop(0.5,'#1e0a3c'); bg.addColorStop(1,'#09090b');
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

  // Purple glow left
  const g1=ctx.createRadialGradient(W*0.18,H*0.5,0,W*0.18,H*0.5,H*0.7);
  g1.addColorStop(0,'rgba(124,58,237,0.4)'); g1.addColorStop(1,'rgba(124,58,237,0)');
  ctx.fillStyle=g1; ctx.fillRect(0,0,W,H);

  // Mini icon on left
  const iconCanvas=document.createElement('canvas'); iconCanvas.width=iconCanvas.height=200;
  drawIcon(iconCanvas,200);
  ctx.drawImage(iconCanvas,60,H/2-100,200,200);

  // Text right side
  ctx.fillStyle='white'; ctx.shadowColor='rgba(167,139,250,0.5)'; ctx.shadowBlur=20;
  ctx.font='bold 72px Arial,sans-serif'; ctx.textAlign='left';
  ctx.fillText('SpeakFlow',300,H*0.44);

  ctx.shadowBlur=0; ctx.fillStyle='rgba(167,139,250,0.9)';
  ctx.font='bold 28px Arial,sans-serif';
  ctx.fillText('Inglês profissional com IA',300,H*0.44+48);

  ctx.fillStyle='rgba(255,255,255,0.5)'; ctx.font='20px Arial,sans-serif';
  ctx.fillText('Live Assist · Circles · Ferramentas · Chat',300,H*0.44+90);

  // Badge pill
  ctx.fillStyle='rgba(124,58,237,0.3)';
  ctx.strokeStyle='rgba(124,58,237,0.6)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.roundRect(300,H*0.44+110,170,36,18); ctx.fill(); ctx.stroke();
  ctx.fillStyle='rgba(167,139,250,1)'; ctx.font='bold 16px Arial,sans-serif'; ctx.textAlign='center';
  ctx.fillText('🆓 Comece grátis',385,H*0.44+133);
}

drawIcon(document.getElementById('icon'),512);
drawBanner(document.getElementById('banner'));

function dl(id,name){
  const a=document.createElement('a'); a.download=name;
  a.href=document.getElementById(id).toDataURL('image/png'); a.click();
}
</script>
</body>
</html>
