name: escolas-ci

on:
  push:
    branches: ["feature/**"]
    paths:
      - "pageCallAssistant/**"
      - ".github/workflows/escolas-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "pageCallAssistant/**"
      - ".github/workflows/escolas-ci.yml"

defaults:
  run:
    working-directory: pageCallAssistant

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Job 1: tsc, lint, vitest, start.sh × 3 e testes de integração
  # ─────────────────────────────────────────────────────────────────────────
  start-sh:
    name: start.sh × 3 + tsc + lint + vitest + int tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: pageCallAssistant/package-lock.json

      # Senhas geradas a cada execução — nunca escritas no código
      - name: Gerar senhas de teste
        run: |
          PG_PASS="$(openssl rand -hex 16)"
          APP1="$(openssl rand -hex 12)"
          APP2="$(openssl rand -hex 12)"
          echo "::add-mask::$PG_PASS"
          echo "::add-mask::$APP1"
          echo "::add-mask::$APP2"
          echo "PG_PASS=$PG_PASS"   >> "$GITHUB_ENV"
          echo "APP_PASS_1=$APP1"   >> "$GITHUB_ENV"
          echo "APP_PASS_2=$APP2"   >> "$GITHUB_ENV"
        working-directory: .

      # Postgres 16 via docker (trust — a autenticação do escolas_app é testada pelo check-app-role)
      - name: Iniciar Postgres 16
        run: |
          docker run -d \
            --name pg16 \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            -p 5432:5432 \
            postgres:16
          for i in $(seq 1 30); do
            docker exec pg16 pg_isready -U postgres && break
            sleep 1
          done
        working-directory: .

      - name: Criar bancos
        run: |
          psql -h localhost -U postgres -c "CREATE DATABASE ai;"
          psql -h localhost -U postgres -c "CREATE DATABASE catalogo;"
          psql -h localhost -U postgres -c "CREATE DATABASE db01;"
          psql -h localhost -U postgres -c "CREATE DATABASE db02;"
        working-directory: .

      - name: Instalar dependências
        run: npm ci --legacy-peer-deps

      - name: Gerar clientes Prisma
        run: |
          npx prisma generate
          npx prisma generate --schema prisma/escolas/schema.prisma
          npx prisma generate --schema prisma/escolas-catalogo/schema.prisma

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Vitest
        run: npm test

      # ── start.sh 1/3: primeira execução normal ──────────────────────────
      - name: "start.sh [1/3] — primeira execucao"
        env:
          DATABASE_URL: "postgresql://postgres@localhost:5432/ai"
          ESCOLAS_CATALOGO_URL: "postgresql://postgres@localhost:5432/catalogo"
          ESCOLAS_DB_01_URL: "postgresql://postgres@localhost:5432/db01"
          ESCOLAS_DB_02_URL: "postgresql://postgres@localhost:5432/db02"
          ESCOLAS_APP_DB_PASSWORD: "${{ env.APP_PASS_1 }}"
          NEXTAUTH_SECRET: "ci-secret-only"
          NEXTAUTH_URL: "http://localhost:3000"
          ESCOLAS_STAFF_JWT_SECRET: "ci-staff-secret"
          ESCOLAS_STUDENT_JWT_SECRET: "ci-student-secret"
          EDU_FAMILY_JWT_SECRET: "ci-family-secret"
          START_SERVER: "false"
        run: sh scripts/start.sh

      # ── start.sh 2/3: troca de senha + verificação de idempotência ───────
      - name: "start.sh [2/3] — troca de senha + idempotencia"
        env:
          DATABASE_URL: "postgresql://postgres@localhost:5432/ai"
          ESCOLAS_CATALOGO_URL: "postgresql://postgres@localhost:5432/catalogo"
          ESCOLAS_DB_01_URL: "postgresql://postgres@localhost:5432/db01"
          ESCOLAS_DB_02_URL: "postgresql://postgres@localhost:5432/db02"
          ESCOLAS_APP_DB_PASSWORD: "${{ env.APP_PASS_2 }}"
          NEXTAUTH_SECRET: "ci-secret-only"
          NEXTAUTH_URL: "http://localhost:3000"
          ESCOLAS_STAFF_JWT_SECRET: "ci-staff-secret"
          ESCOLAS_STUDENT_JWT_SECRET: "ci-student-secret"
          EDU_FAMILY_JWT_SECRET: "ci-family-secret"
          START_SERVER: "false"
        run: |
          before=$(psql -h localhost -U postgres -d db01 -t -c 'SELECT COUNT(*) FROM "EduSkill";' | tr -d ' \n')
          sh scripts/start.sh
          after=$(psql -h localhost -U postgres -d db01 -t -c 'SELECT COUNT(*) FROM "EduSkill";' | tr -d ' \n')
          if [ "$before" != "$after" ]; then
            echo "FAIL: contagem de EduSkill mudou ($before -> $after) — nao e idempotente"
            exit 1
          fi
          echo "OK: idempotencia confirmada ($after habilidades)"

      # ── start.sh 3/3: CONTEUDO_FORCE_FAIL não derruba o servidor ─────────
      - name: "start.sh [3/3] — CONTEUDO_FORCE_FAIL=true sobrevive"
        env:
          DATABASE_URL: "postgresql://postgres@localhost:5432/ai"
          ESCOLAS_CATALOGO_URL: "postgresql://postgres@localhost:5432/catalogo"
          ESCOLAS_DB_01_URL: "postgresql://postgres@localhost:5432/db01"
          ESCOLAS_DB_02_URL: "postgresql://postgres@localhost:5432/db02"
          ESCOLAS_APP_DB_PASSWORD: "${{ env.APP_PASS_2 }}"
          NEXTAUTH_SECRET: "ci-secret-only"
          NEXTAUTH_URL: "http://localhost:3000"
          ESCOLAS_STAFF_JWT_SECRET: "ci-staff-secret"
          ESCOLAS_STUDENT_JWT_SECRET: "ci-student-secret"
          EDU_FAMILY_JWT_SECRET: "ci-family-secret"
          START_SERVER: "false"
          CONTEUDO_FORCE_FAIL: "true"
        run: sh scripts/start.sh

      # ── Testes de integração ─────────────────────────────────────────────
      - name: Testes de integração (escolas)
        env:
          TEST_PG_URL: "postgresql://postgres@localhost:5432"
          ESCOLAS_APP_DB_PASSWORD: "${{ env.APP_PASS_2 }}"
          ESCOLAS_CATALOG_URL: "postgresql://postgres@localhost:5432/catalogo"
          ESCOLAS_DB_URL: "postgresql://postgres@localhost:5432/db01"
          ESCOLAS_DB_01_URL: "postgresql://postgres@localhost:5432/db01"
          ESCOLAS_DB_02_URL: "postgresql://postgres@localhost:5432/db02"
        run: npm run escolas:test:int
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────────────────
  # Job 2: docker build + docker run (valida a imagem de produção real)
  # ─────────────────────────────────────────────────────────────────────────
  docker:
    name: docker build + docker run
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: pageCallAssistant/package-lock.json

      # Senhas próprias deste job (independentes do start-sh)
      - name: Gerar senhas de teste
        run: |
          APP_PASS="$(openssl rand -hex 12)"
          echo "::add-mask::$APP_PASS"
          echo "APP_PASS=$APP_PASS" >> "$GITHUB_ENV"
        working-directory: .

      # Postgres 16 para o docker run (trust — igual ao job start-sh)
      - name: Iniciar Postgres 16
        run: |
          docker run -d \
            --name pg16 \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            -p 5432:5432 \
            postgres:16
          for i in $(seq 1 30); do
            docker exec pg16 pg_isready -U postgres && break
            sleep 1
          done
        working-directory: .

      - name: Criar bancos
        run: |
          psql -h localhost -U postgres -c "CREATE DATABASE ai;"
          psql -h localhost -U postgres -c "CREATE DATABASE catalogo;"
          psql -h localhost -U postgres -c "CREATE DATABASE db01;"
          psql -h localhost -U postgres -c "CREATE DATABASE db02;"
        working-directory: .

      # npm ci necessário apenas para prisma generate (não copia para a imagem)
      - name: Instalar dependências (para prisma generate)
        run: npm ci --legacy-peer-deps

      - name: Gerar clientes Prisma (para o build)
        run: |
          npx prisma generate
          npx prisma generate --schema prisma/escolas/schema.prisma
          npx prisma generate --schema prisma/escolas-catalogo/schema.prisma

      - name: Docker build
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_APP_URL=http://localhost:3000 \
            -t speakflow-escolas-ci:latest \
            .

      - name: "Docker run — start.sh no container de producao"
        run: |
          docker run --rm \
            --network host \
            -e DATABASE_URL="postgresql://postgres@localhost:5432/ai" \
            -e ESCOLAS_CATALOGO_URL="postgresql://postgres@localhost:5432/catalogo" \
            -e ESCOLAS_DB_01_URL="postgresql://postgres@localhost:5432/db01" \
            -e ESCOLAS_DB_02_URL="postgresql://postgres@localhost:5432/db02" \
            -e ESCOLAS_APP_DB_PASSWORD="$APP_PASS" \
            -e NEXTAUTH_SECRET="ci-secret-only" \
            -e NEXTAUTH_URL="http://localhost:3000" \
            -e ESCOLAS_STAFF_JWT_SECRET="ci-staff-secret" \
            -e ESCOLAS_STUDENT_JWT_SECRET="ci-student-secret" \
            -e EDU_FAMILY_JWT_SECRET="ci-family-secret" \
            -e START_SERVER="false" \
            speakflow-escolas-ci:latest 2>&1 | tee /tmp/docker-run.log
          grep -q "\[check-role\]" /tmp/docker-run.log \
            && echo "check-role OK" \
            || { echo "FAIL: [check-role] nao encontrado no log"; exit 1; }
        working-directory: .

      - name: Upload docker run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-run-log
          path: /tmp/docker-run.log
