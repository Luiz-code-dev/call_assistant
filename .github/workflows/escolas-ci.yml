name: escolas-ci

on:
  push:
    branches: [main]
    paths:
      - "pageCallAssistant/**"
      - ".github/workflows/escolas-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "pageCallAssistant/**"
      - ".github/workflows/escolas-ci.yml"

defaults:
  run:
    working-directory: pageCallAssistant

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Job 1: tsc, lint, vitest, start.sh × 3 e testes de integração
  # ─────────────────────────────────────────────────────────────────────────
  start-sh:
    name: start.sh × 3 + tsc + lint + vitest + int tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: pageCallAssistant/package-lock.json

      # Senhas e segredos gerados a cada execução — nunca escritos no código
      - name: Gerar senhas de teste
        run: |
          PG_PASS="$(openssl rand -hex 16)"
          APP1="$(openssl rand -hex 12)"
          APP2="$(openssl rand -hex 12)"
          NXSECRET="$(openssl rand -hex 32)"
          STAFFSEC="$(openssl rand -hex 32)"
          STUDSEC="$(openssl rand -hex 32)"
          FAMSEC="$(openssl rand -hex 32)"
          echo "::add-mask::$PG_PASS"
          echo "::add-mask::$APP1"
          echo "::add-mask::$APP2"
          echo "::add-mask::$NXSECRET"
          echo "::add-mask::$STAFFSEC"
          echo "::add-mask::$STUDSEC"
          echo "::add-mask::$FAMSEC"
          echo "PG_PASS=$PG_PASS"         >> "$GITHUB_ENV"
          echo "APP_PASS_1=$APP1"         >> "$GITHUB_ENV"
          echo "APP_PASS_2=$APP2"         >> "$GITHUB_ENV"
          echo "CI_NEXTAUTH_SECRET=$NXSECRET"   >> "$GITHUB_ENV"
          echo "CI_STAFF_JWT=$STAFFSEC"         >> "$GITHUB_ENV"
          echo "CI_STUDENT_JWT=$STUDSEC"        >> "$GITHUB_ENV"
          echo "CI_FAMILY_JWT=$FAMSEC"          >> "$GITHUB_ENV"
        working-directory: .

      - name: Criar bancos
        run: |
          psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE ai;"
          psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE catalogo;"
          psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE db01;"
          psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE db02;"
        working-directory: .

      - name: Instalar dependências
        run: npm ci --legacy-peer-deps

      - name: Gerar clientes Prisma
        run: |
          npx prisma generate
          npx prisma generate --schema prisma/escolas/schema.prisma
          npx prisma generate --schema prisma/escolas-catalogo/schema.prisma

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Vitest
        run: npm test

      # ── start.sh 1/3: primeira execução normal ──────────────────────────
      - name: "start.sh [1/3] — primeira execucao"
        env:
          DATABASE_URL: "postgresql://postgres@127.0.0.1:5432/ai"
          ESCOLAS_CATALOG_URL: "postgresql://postgres@127.0.0.1:5432/catalogo"
          ESCOLAS_DB_01_URL: "postgresql://postgres@127.0.0.1:5432/db01"
          ESCOLAS_DB_02_URL: "postgresql://postgres@127.0.0.1:5432/db02"
          ESCOLAS_APP_DB_PASSWORD: "${{ env.APP_PASS_1 }}"
          NEXTAUTH_SECRET: "${{ env.CI_NEXTAUTH_SECRET }}"
          NEXTAUTH_URL: "http://localhost:3000"
          ESCOLAS_STAFF_JWT_SECRET: "${{ env.CI_STAFF_JWT }}"
          ESCOLAS_STUDENT_JWT_SECRET: "${{ env.CI_STUDENT_JWT }}"
          EDU_FAMILY_JWT_SECRET: "${{ env.CI_FAMILY_JWT }}"
          START_SERVER: "false"
        run: |
          sh scripts/start.sh 2>&1 | tee /tmp/start-sh-1.log
          if grep -q "importacao de conteudo falhou" /tmp/start-sh-1.log; then
            echo "FAIL: importacao de conteudo falhou — revisar migracao ou script de conteudo"
            exit 1
          fi
          echo "OK: conteudo importado sem erros"

      # ── Drift check: schema.prisma deve coincidir com o banco migrado ────
      - name: "Drift check — schema vs banco migrado"
        env:
          DATABASE_URL: "postgresql://postgres@127.0.0.1:5432/ai"
          ESCOLAS_DB_URL: "postgresql://postgres@127.0.0.1:5432/db01"
        run: |
          # Banco tenant (Escolas)
          npx prisma migrate diff \
            --from-url "postgresql://postgres@127.0.0.1:5432/db01" \
            --to-schema-datamodel prisma/escolas/schema.prisma \
            --exit-code \
            || { echo "FAIL: schema.prisma de escolas diverge do banco migrado — adicione uma migration"; exit 1; }
          echo "OK: sem deriva no banco de escolas (db01)"
          # Catálogo
          npx prisma migrate diff \
            --from-url "postgresql://postgres@127.0.0.1:5432/catalogo" \
            --to-schema-datamodel prisma/escolas-catalogo/schema.prisma \
            --exit-code \
            || { echo "FAIL: schema do catalogo diverge — adicione uma migration"; exit 1; }
          echo "OK: sem deriva no catalogo"
          # SpeakFlow AI — aviso apenas (débito técnico pré-existente; não bloqueia CI)
          npx prisma migrate diff \
            --from-url "postgresql://postgres@127.0.0.1:5432/ai" \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code \
            && echo "OK: sem deriva no SpeakFlow AI" \
            || echo "WARN: schema do SpeakFlow AI diverge — debito pre-existente, nao causado por este PR"

      # ── start.sh 2/3: troca de senha + verificação de idempotência ───────
      - name: "start.sh [2/3] — troca de senha + idempotencia"
        env:
          DATABASE_URL: "postgresql://postgres@127.0.0.1:5432/ai"
          ESCOLAS_CATALOG_URL: "postgresql://postgres@127.0.0.1:5432/catalogo"
          ESCOLAS_DB_01_URL: "postgresql://postgres@127.0.0.1:5432/db01"
          ESCOLAS_DB_02_URL: "postgresql://postgres@127.0.0.1:5432/db02"
          ESCOLAS_APP_DB_PASSWORD: "${{ env.APP_PASS_2 }}"
          NEXTAUTH_SECRET: "${{ env.CI_NEXTAUTH_SECRET }}"
          NEXTAUTH_URL: "http://localhost:3000"
          ESCOLAS_STAFF_JWT_SECRET: "${{ env.CI_STAFF_JWT }}"
          ESCOLAS_STUDENT_JWT_SECRET: "${{ env.CI_STUDENT_JWT }}"
          EDU_FAMILY_JWT_SECRET: "${{ env.CI_FAMILY_JWT }}"
          START_SERVER: "false"
        run: |
          before=$(psql -h 127.0.0.1 -U postgres -d db01 -t -c 'SELECT COUNT(*) FROM "EduSkill";' | tr -d ' \n')
          sh scripts/start.sh
          after=$(psql -h 127.0.0.1 -U postgres -d db01 -t -c 'SELECT COUNT(*) FROM "EduSkill";' | tr -d ' \n')
          if [ "$before" != "$after" ]; then
            echo "FAIL: contagem de EduSkill mudou ($before -> $after) — nao e idempotente"
            exit 1
          fi
          echo "OK: idempotencia confirmada ($after habilidades)"

      # ── start.sh 3/3: CONTEUDO_FORCE_FAIL não derruba o servidor ─────────
      - name: "start.sh [3/3] — CONTEUDO_FORCE_FAIL=true sobrevive"
        env:
          DATABASE_URL: "postgresql://postgres@127.0.0.1:5432/ai"
          ESCOLAS_CATALOG_URL: "postgresql://postgres@127.0.0.1:5432/catalogo"
          ESCOLAS_DB_01_URL: "postgresql://postgres@127.0.0.1:5432/db01"
          ESCOLAS_DB_02_URL: "postgresql://postgres@127.0.0.1:5432/db02"
          ESCOLAS_APP_DB_PASSWORD: "${{ env.APP_PASS_2 }}"
          NEXTAUTH_SECRET: "${{ env.CI_NEXTAUTH_SECRET }}"
          NEXTAUTH_URL: "http://localhost:3000"
          ESCOLAS_STAFF_JWT_SECRET: "${{ env.CI_STAFF_JWT }}"
          ESCOLAS_STUDENT_JWT_SECRET: "${{ env.CI_STUDENT_JWT }}"
          EDU_FAMILY_JWT_SECRET: "${{ env.CI_FAMILY_JWT }}"
          START_SERVER: "false"
          CONTEUDO_FORCE_FAIL: "true"
        run: sh scripts/start.sh

      # ── Teste de upgrade: main → branch nos mesmos bancos (simula produção) ─
      - name: Checkout main (para teste de upgrade)
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-wt

      - name: "start.sh [upgrade] — main contra bancos vazios, depois esta branch"
        working-directory: .
        run: |
          # Bancos isolados para não interferir com os anteriores
          psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE ai_up;"
          psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE cat_up;"
          psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE db01_up;"
          psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE db02_up;"

          # Preparar o checkout do main
          cd main-wt/pageCallAssistant
          npm ci --legacy-peer-deps
          npx prisma generate
          npx prisma generate --schema prisma/escolas/schema.prisma
          npx prisma generate --schema prisma/escolas-catalogo/schema.prisma

          # O start.sh da main não tem START_SERVER=false — ele termina com `exec node server.js`.
          # Como não há build (e não queremos 5 min de next build só para o upgrade test),
          # criamos um stub que sai com 0 para que o passo complete sem erro.
          echo "console.log('[upgrade-test] server.js stub: databases initialized');" \
               "process.exit(0);" > server.js

          # 1/2: start.sh da main contra bancos vazios (estado de produção antes do deploy)
          # O prisma do main-wt precisa estar no PATH antes do start.sh, que só adiciona /app ao PATH recebido
          export PATH="$GITHUB_WORKSPACE/main-wt/pageCallAssistant/node_modules/.bin:$PATH"
          DATABASE_URL="postgresql://postgres@127.0.0.1:5432/ai_up" \
          ESCOLAS_CATALOG_URL="postgresql://postgres@127.0.0.1:5432/cat_up" \
          ESCOLAS_DB_01_URL="postgresql://postgres@127.0.0.1:5432/db01_up" \
          ESCOLAS_DB_02_URL="postgresql://postgres@127.0.0.1:5432/db02_up" \
          ESCOLAS_APP_DB_PASSWORD="$APP_PASS_1" \
          NEXTAUTH_SECRET="$CI_NEXTAUTH_SECRET" \
          NEXTAUTH_URL="http://localhost:3000" \
          ESCOLAS_STAFF_JWT_SECRET="$CI_STAFF_JWT" \
          ESCOLAS_STUDENT_JWT_SECRET="$CI_STUDENT_JWT" \
          EDU_FAMILY_JWT_SECRET="$CI_FAMILY_JWT" \
          START_SERVER=false \
          sh scripts/start.sh
          echo "[upgrade-test] start.sh da main OK"

          # 2/2: start.sh desta branch contra os mesmos bancos (simula o deploy em produção)
          cd "$GITHUB_WORKSPACE/pageCallAssistant"
          # Garantir que o prisma da branch esteja no PATH
          export PATH="$GITHUB_WORKSPACE/pageCallAssistant/node_modules/.bin:$PATH"
          DATABASE_URL="postgresql://postgres@127.0.0.1:5432/ai_up" \
          ESCOLAS_CATALOG_URL="postgresql://postgres@127.0.0.1:5432/cat_up" \
          ESCOLAS_DB_01_URL="postgresql://postgres@127.0.0.1:5432/db01_up" \
          ESCOLAS_DB_02_URL="postgresql://postgres@127.0.0.1:5432/db02_up" \
          ESCOLAS_APP_DB_PASSWORD="$APP_PASS_1" \
          NEXTAUTH_SECRET="$CI_NEXTAUTH_SECRET" \
          NEXTAUTH_URL="http://localhost:3000" \
          ESCOLAS_STAFF_JWT_SECRET="$CI_STAFF_JWT" \
          ESCOLAS_STUDENT_JWT_SECRET="$CI_STUDENT_JWT" \
          EDU_FAMILY_JWT_SECRET="$CI_FAMILY_JWT" \
          START_SERVER=false \
          sh scripts/start.sh
          echo "[upgrade-test] Upgrade main→branch simulado com sucesso"

      # ── Testes de integração ─────────────────────────────────────────────
      - name: Testes de integração (escolas)
        env:
          TEST_PG_URL: "postgresql://postgres@127.0.0.1:5432"
          ESCOLAS_APP_DB_PASSWORD: "${{ env.APP_PASS_2 }}"
          ESCOLAS_CATALOG_URL: "postgresql://postgres@127.0.0.1:5432/catalogo"
          ESCOLAS_DB_URL: "postgresql://postgres@127.0.0.1:5432/db01"
          ESCOLAS_DB_01_URL: "postgresql://postgres@127.0.0.1:5432/db01"
          ESCOLAS_DB_02_URL: "postgresql://postgres@127.0.0.1:5432/db02"
        run: npm run escolas:test:int
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────────────────
  # Job 2: docker build + docker run (valida a imagem de produção real)
  # ─────────────────────────────────────────────────────────────────────────
  docker:
    name: docker build + docker run
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: pageCallAssistant/package-lock.json

      # Senhas e segredos próprios deste job (independentes do start-sh)
      - name: Gerar senhas de teste
        run: |
          APP_PASS="$(openssl rand -hex 12)"
          NXSECRET="$(openssl rand -hex 32)"
          STAFFSEC="$(openssl rand -hex 32)"
          STUDSEC="$(openssl rand -hex 32)"
          FAMSEC="$(openssl rand -hex 32)"
          echo "::add-mask::$APP_PASS"
          echo "::add-mask::$NXSECRET"
          echo "::add-mask::$STAFFSEC"
          echo "::add-mask::$STUDSEC"
          echo "::add-mask::$FAMSEC"
          echo "APP_PASS=$APP_PASS"             >> "$GITHUB_ENV"
          echo "CI_NEXTAUTH_SECRET=$NXSECRET"   >> "$GITHUB_ENV"
          echo "CI_STAFF_JWT=$STAFFSEC"         >> "$GITHUB_ENV"
          echo "CI_STUDENT_JWT=$STUDSEC"        >> "$GITHUB_ENV"
          echo "CI_FAMILY_JWT=$FAMSEC"          >> "$GITHUB_ENV"
        working-directory: .

      # Postgres 16 para o docker run (trust — igual ao job start-sh)
      - name: Iniciar Postgres 16
        run: |
          docker run -d \
            --name pg16 \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            -p 5432:5432 \
            postgres:16
        working-directory: .

      - name: Esperar o Postgres ficar pronto
        run: |
          for i in $(seq 1 60); do
            if pg_isready -h 127.0.0.1 -p 5432 -U postgres >/dev/null 2>&1 \
               && psql -h 127.0.0.1 -U postgres -c "SELECT 1" >/dev/null 2>&1; then
              echo "Postgres pronto em ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "Postgres nao subiu em 60s"; docker logs $(docker ps -q --filter ancestor=postgres:16) || true
          exit 1
        working-directory: .

      - name: Criar bancos
        run: |
          psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE ai;"
          psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE catalogo;"
          psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE db01;"
          psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE db02;"
        working-directory: .

      # npm ci necessário apenas para prisma generate (não copia para a imagem)
      - name: Instalar dependências (para prisma generate)
        run: npm ci --legacy-peer-deps

      - name: Gerar clientes Prisma (para o build)
        run: |
          npx prisma generate
          npx prisma generate --schema prisma/escolas/schema.prisma
          npx prisma generate --schema prisma/escolas-catalogo/schema.prisma

      - name: Docker build
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_APP_URL=http://localhost:3000 \
            -t speakflow-escolas-ci:latest \
            .

      - name: "Docker run — start.sh no container de producao"
        run: |
          docker run --rm \
            --network host \
            -e DATABASE_URL="postgresql://postgres@127.0.0.1:5432/ai" \
            -e ESCOLAS_CATALOG_URL="postgresql://postgres@127.0.0.1:5432/catalogo" \
            -e ESCOLAS_DB_01_URL="postgresql://postgres@127.0.0.1:5432/db01" \
            -e ESCOLAS_DB_02_URL="postgresql://postgres@127.0.0.1:5432/db02" \
            -e ESCOLAS_APP_DB_PASSWORD="$APP_PASS" \
            -e NEXTAUTH_SECRET="$CI_NEXTAUTH_SECRET" \
            -e NEXTAUTH_URL="http://localhost:3000" \
            -e ESCOLAS_STAFF_JWT_SECRET="$CI_STAFF_JWT" \
            -e ESCOLAS_STUDENT_JWT_SECRET="$CI_STUDENT_JWT" \
            -e EDU_FAMILY_JWT_SECRET="$CI_FAMILY_JWT" \
            -e START_SERVER="false" \
            -e ESCOLAS_SEED_DEMO="true" \
            -e ESCOLAS_SEED_USUARIOS="true" \
            speakflow-escolas-ci:latest 2>&1 | tee /tmp/docker-run.log
          grep -q "\[check-role\]" /tmp/docker-run.log \
            && echo "check-role OK" \
            || { echo "FAIL: [check-role] nao encontrado no log"; exit 1; }
          if grep -q "importacao de conteudo falhou" /tmp/docker-run.log; then
            echo "FAIL: importacao de conteudo falhou no container de producao"
            exit 1
          fi
          echo "OK: conteudo importado sem erros (docker)"
        working-directory: .

      # Seed usuarios demo no host (node_modules disponível após npm ci)
      - name: "Seed usuarios demo (host)"
        env:
          ESCOLAS_CATALOG_URL: "postgresql://postgres@127.0.0.1:5432/catalogo"
          ESCOLAS_DB_01_URL: "postgresql://postgres@127.0.0.1:5432/db01"
          ESCOLAS_DB_02_URL: "postgresql://postgres@127.0.0.1:5432/db02"
        run: |
          node scripts/escolas/seed-usuarios-demo.mjs 2>&1 | tail -20
          echo "Seed usuarios: OK"

      # ── Smoke tests: server real + rotas autenticadas ────────────────────
      - name: "Smoke tests — servidor real + endpoints autenticados"
        run: |
          # Inicia o container em background COM o servidor (sem START_SERVER=false)
          docker run -d --name sf-smoke \
            --network host \
            -e DATABASE_URL="postgresql://postgres@127.0.0.1:5432/ai" \
            -e ESCOLAS_CATALOG_URL="postgresql://postgres@127.0.0.1:5432/catalogo" \
            -e ESCOLAS_DB_01_URL="postgresql://postgres@127.0.0.1:5432/db01" \
            -e ESCOLAS_DB_02_URL="postgresql://postgres@127.0.0.1:5432/db02" \
            -e ESCOLAS_APP_DB_PASSWORD="$APP_PASS" \
            -e NEXTAUTH_SECRET="$CI_NEXTAUTH_SECRET" \
            -e NEXTAUTH_URL="http://localhost:3001" \
            -e ESCOLAS_STAFF_JWT_SECRET="$CI_STAFF_JWT" \
            -e ESCOLAS_STUDENT_JWT_SECRET="$CI_STUDENT_JWT" \
            -e EDU_FAMILY_JWT_SECRET="$CI_FAMILY_JWT" \
            -e PORT=3001 \
            speakflow-escolas-ci:latest 2>&1

          # Aguarda o servidor ficar pronto (máx 60 s)
          echo "Aguardando servidor na porta 3001..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3001/api/health >/dev/null 2>&1 \
               || curl -sf http://localhost:3001/ >/dev/null 2>&1; then
              echo "Servidor pronto em ${i}s"
              break
            fi
            sleep 1
            if [ "$i" -eq 60 ]; then
              echo "FAIL: servidor nao subiu em 60s"
              docker logs sf-smoke || true
              exit 1
            fi
          done

          # Login como prof.demo (endpoint correto: /auth/staff/login)
          PROF_HTTP=$(curl -s -c /tmp/prof-cookies.txt -b /tmp/prof-cookies.txt \
            -X POST http://localhost:3001/api/escola/auth/staff/login \
            -H "Content-Type: application/json" \
            -d '{"email":"prof.demo@speakflow.escola","password":"Speakflow@2027"}' \
            -w "%{http_code}" -o /tmp/prof-login.json)
          echo "Login prof.demo: HTTP $PROF_HTTP"
          if [ "$PROF_HTTP" != "200" ]; then
            echo "FAIL: login do professor retornou $PROF_HTTP"; cat /tmp/prof-login.json; exit 1
          fi

          # Login como direcao.demo
          DIR_HTTP=$(curl -s -c /tmp/dir-cookies.txt -b /tmp/dir-cookies.txt \
            -X POST http://localhost:3001/api/escola/auth/staff/login \
            -H "Content-Type: application/json" \
            -d '{"email":"direcao.demo@speakflow.escola","password":"Speakflow@2027"}' \
            -w "%{http_code}" -o /tmp/dir-login.json)
          echo "Login direcao.demo: HTTP $DIR_HTTP"
          if [ "$DIR_HTTP" != "200" ]; then
            echo "FAIL: login da direcao retornou $DIR_HTTP"; cat /tmp/dir-login.json; exit 1
          fi

          FAIL=0
          # Smoke tests como professor
          for ENDPOINT in \
            "/api/escola/auth/me" \
            "/api/escola/professor/turmas" \
            "/api/escola/professor/ofertas" \
            "/api/escola/trilhas"; do
            STATUS=$(curl -s -b /tmp/prof-cookies.txt \
              http://localhost:3001${ENDPOINT} \
              -w "%{http_code}" -o /dev/null 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "OK: prof.demo $ENDPOINT => $STATUS"
            else
              echo "FAIL: prof.demo $ENDPOINT => $STATUS (esperado 200)"
              FAIL=1
            fi
          done

          # Smoke tests como direção
          for ENDPOINT in \
            "/api/escola/auth/me" \
            "/api/escola/direcao/familias"; do
            STATUS=$(curl -s -b /tmp/dir-cookies.txt \
              http://localhost:3001${ENDPOINT} \
              -w "%{http_code}" -o /dev/null 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "OK: direcao.demo $ENDPOINT => $STATUS"
            else
              echo "FAIL: direcao.demo $ENDPOINT => $STATUS (esperado 200)"
              FAIL=1
            fi
          done

          docker logs sf-smoke > /tmp/smoke-server.log 2>&1 || true
          docker stop sf-smoke || true
          docker rm sf-smoke || true

          [ "$FAIL" -eq 0 ] || { echo "Um ou mais smoke tests falharam"; exit 1; }
          echo "Smoke tests: todos OK"
        working-directory: .

      - name: Upload docker run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-run-log
          path: |
            /tmp/docker-run.log
            /tmp/smoke-server.log
