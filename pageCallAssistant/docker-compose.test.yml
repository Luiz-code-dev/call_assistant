version: "3.9"
# Postgres locais para os testes de integração do SpeakFlow Escolas.
# Uso:
#   export ESCOLAS_TEST_PG_PASS=<senha-local>
#   docker compose -f docker-compose.test.yml up -d
#   npm run escolas:test:integration
#
# A senha é lida de ESCOLAS_TEST_PG_PASS — nunca hardcode aqui.
# Crie um .env.test local (não commitado) ou exporte a variável antes de subir.
services:
  escolas-catalogo:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: escolas_catalogo
      POSTGRES_USER: escolas
      POSTGRES_PASSWORD: ${ESCOLAS_TEST_PG_PASS}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U escolas -d escolas_catalogo"]
      interval: 3s
      timeout: 5s
      retries: 10

  escolas-dados-01:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: escolas_dados_01
      POSTGRES_USER: escolas
      POSTGRES_PASSWORD: ${ESCOLAS_TEST_PG_PASS}
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U escolas -d escolas_dados_01"]
      interval: 3s
      timeout: 5s
      retries: 10

  escolas-dados-02:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: escolas_dados_02
      POSTGRES_USER: escolas
      POSTGRES_PASSWORD: ${ESCOLAS_TEST_PG_PASS}
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U escolas -d escolas_dados_02"]
      interval: 3s
      timeout: 5s
      retries: 10
