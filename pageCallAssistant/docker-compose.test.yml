version: "3.9"
# Postgres 16 local para os testes de integração do SpeakFlow Escolas.
# Uso:
#   docker compose -f docker-compose.test.yml up -d
#   # aguardar healthcheck
#   node scripts/escolas/test-db-setup.mjs  # cria bancos e roles
#   sh scripts/start.sh                      # migra + provisiona escolas_app
services:
  pg:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 5s
      retries: 15
    volumes:
      - escolas_pg16_data:/var/lib/postgresql/data

volumes:
  escolas_pg16_data:
